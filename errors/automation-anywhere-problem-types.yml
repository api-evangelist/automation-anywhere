direct_execution_statuses:
  source: https://ai-kb.automationanywhere.com/tools/direct-execution-api
  endpoint: POST /tools/execute-workflow
  statuses:
    - status: 401
      meaning: API key or secret missing, invalid or revoked.
    - status: 402
      meaning: The team does not have sufficient credits.
    - status: 403
      meaning: The API user is not a project member or cannot execute Flows.
    - status: 404
      meaning: tool_id does not exist or does not belong to the project.
    - status: 422
      meaning: A required request field is missing or has an invalid type.
    - status: 200
      meaning: >-
        Accepted but a Flow node failed when the body carries "success": false --
        inspect error, node_results and execution_id.

specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Automation Anywhere
providerId: automation-anywhere
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
notes: Automation Anywhere pricing is not publicly posted; this artifact models the FinOps shape of an
  Automation 360 deployment. Per-edition prices and bot counts come from the customer's signed order
  form.
tags:
  - FinOps
  - FOCUS
  - RPA
  - Intelligent Automation
description: 'FOCUS-aligned FinOps for Automation Anywhere: subscription-based platform license sized
  by edition and licensed bot count, with separately licensed AI Agent Studio and Document Automation
  add-ons.'
sources:
  - https://www.automationanywhere.com/
  - https://www.automationanywhere.com/products/automation-360
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Automation Anywhere, Inc.
serviceCategory: RPA / Intelligent Automation
billingModel:
  pricingCategory: Tiered Subscription
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
    - Adjustment
    - Tax
    - Credit
focusColumns:
  ServiceName: Automation Anywhere
  ServiceCategory: RPA / Intelligent Automation
  ProviderName: Automation Anywhere
  PublisherName: Automation Anywhere, Inc.
  InvoiceIssuerName: Automation Anywhere, Inc.
  BillingCurrency: USD
meters:
  - name: licensed_bots
    unit: bot
    aggregation: max
    dimensions:
      - bot_type
      - edition
  - name: control_room_subscription
    unit: month
    aggregation: sum
    dimensions:
      - edition
      - region
  - name: ai_agent_studio_usage
    unit: invocation
    aggregation: sum
    dimensions:
      - model
      - bot
  - name: document_automation_pages
    unit: page
    aggregation: sum
    dimensions:
      - document_type
  - name: copilot_seats
    unit: seat
    aggregation: max
principles:
  - name: Visibility
    description: Use the Control Room's Bot Insight dashboards and the Activity API to see bot run
      counts, durations, and queue throughput. Match against the order-form bot allocation to detect
      under-utilization.
  - name: Allocation
    description: Tag bots and queues by business unit / process owner; chargeback by attributing bot
      run minutes to the requesting team.
  - name: Optimization
    description: Right-size by retiring idle bots, consolidating attended licenses where the same user
      uses multiple, and using AI Agent Studio for long-tail processes instead of dedicated bots.
  - name: Accountability
    description: Center of Excellence (CoE) typically owns Automation Anywhere spend; bot owners are
      named on each automation and review utilization quarterly.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com

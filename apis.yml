      https://docs.automationanywhere.com/bundle/enterprise-v2019/page/enterprise-cloud/topics/developer/cloud-create-package-overview.html
    type: Documentation
  description: >-
    The Automation Anywhere Package SDK is a Java-based development toolkit that enables developers to
    build custom action packages and triggers for the Automation 360 bot editor. Developers use the SDK
    in a Java IDE to implement custom actions, compile the code into a JAR file, and upload the resulting
    package to the Control Room for use in bot workflows.

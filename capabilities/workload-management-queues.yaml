naftiko: 1.0.0-alpha2
info:
  label: Automation Anywhere Workload Management API — Queues
  description: 'Automation Anywhere Workload Management API — Queues. 4 operations. Lead operation: Get a queue by ID. Self-contained
    Naftiko capability covering one Automation Anywhere business surface.'
  tags:
  - Automation Anywhere
  - Queues
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AUTOMATION_ANYWHERE_API_KEY: AUTOMATION_ANYWHERE_API_KEY
capability:
  consumes:
  - type: http
    namespace: workload-management-queues
    baseUri: https://{controlRoomUrl}/v4/wlm
    description: Automation Anywhere Workload Management API — Queues business capability. Self-contained, no shared references.
    resources:
    - name: queues-id
      path: /queues/{id}
      operations:
      - name: getqueue
        method: GET
        description: Get a queue by ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: queues-id-consumers
      path: /queues/{id}/consumers
      operations:
      - name: addqueueconsumer
        method: POST
        description: Add a queue consumer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: queues-id-members-userId
      path: /queues/{id}/members/{userId}
      operations:
      - name: addorupdatequeuemember
        method: PUT
        description: Add or update a queue member
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: queues-id-participants
      path: /queues/{id}/participants
      operations:
      - name: addqueueparticipant
        method: POST
        description: Add a queue participant
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.AUTOMATION_ANYWHERE_API_KEY}}'
  exposes:
  - type: rest
    namespace: workload-management-queues-rest
    port: 8080
    description: REST adapter for Automation Anywhere Workload Management API — Queues. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/queues/{id}
      name: queues-id
      description: REST surface for queues-id.
      operations:
      - method: GET
        name: getqueue
        description: Get a queue by ID
        call: workload-management-queues.getqueue
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/queues/{id}/consumers
      name: queues-id-consumers
      description: REST surface for queues-id-consumers.
      operations:
      - method: POST
        name: addqueueconsumer
        description: Add a queue consumer
        call: workload-management-queues.addqueueconsumer
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/queues/{id}/members/{userid}
      name: queues-id-members-userid
      description: REST surface for queues-id-members-userId.
      operations:
      - method: PUT
        name: addorupdatequeuemember
        description: Add or update a queue member
        call: workload-management-queues.addorupdatequeuemember
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/queues/{id}/participants
      name: queues-id-participants
      description: REST surface for queues-id-participants.
      operations:
      - method: POST
        name: addqueueparticipant
        description: Add a queue participant
        call: workload-management-queues.addqueueparticipant
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: workload-management-queues-mcp
    port: 9090
    transport: http
    description: MCP adapter for Automation Anywhere Workload Management API — Queues. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: get-queue-id
      description: Get a queue by ID
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: workload-management-queues.getqueue
      outputParameters:
      - type: object
        mapping: $.
    - name: add-queue-consumer
      description: Add a queue consumer
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: workload-management-queues.addqueueconsumer
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: add-update-queue-member
      description: Add or update a queue member
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: workload-management-queues.addorupdatequeuemember
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: add-queue-participant
      description: Add a queue participant
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: workload-management-queues.addqueueparticipant
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.

naftiko: 1.0.0-alpha2
info:
  label: Automation Anywhere Repository Management API — Folders
  description: 'Automation Anywhere Repository Management API — Folders. 4 operations. Lead operation: Create a folder. Self-contained
    Naftiko capability covering one Automation Anywhere business surface.'
  tags:
  - Automation Anywhere
  - Folders
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AUTOMATION_ANYWHERE_API_KEY: AUTOMATION_ANYWHERE_API_KEY
capability:
  consumes:
  - type: http
    namespace: repository-management-folders
    baseUri: https://{controlRoomUrl}/v2/repository
    description: Automation Anywhere Repository Management API — Folders business capability. Self-contained, no shared references.
    resources:
    - name: folders-folderid
      path: /folders/{folderid}
      operations:
      - name: createfolder
        method: POST
        description: Create a folder
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: updatefolder
        method: PUT
        description: Update a folder
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletefolder
        method: DELETE
        description: Delete a folder
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: folders-folderid-list
      path: /folders/{folderid}/list
      operations:
      - name: listfoldercontents
        method: POST
        description: List folder contents
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.AUTOMATION_ANYWHERE_API_KEY}}'
  exposes:
  - type: rest
    namespace: repository-management-folders-rest
    port: 8080
    description: REST adapter for Automation Anywhere Repository Management API — Folders. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/folders/{folderid}
      name: folders-folderid
      description: REST surface for folders-folderid.
      operations:
      - method: POST
        name: createfolder
        description: Create a folder
        call: repository-management-folders.createfolder
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatefolder
        description: Update a folder
        call: repository-management-folders.updatefolder
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletefolder
        description: Delete a folder
        call: repository-management-folders.deletefolder
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/folders/{folderid}/list
      name: folders-folderid-list
      description: REST surface for folders-folderid-list.
      operations:
      - method: POST
        name: listfoldercontents
        description: List folder contents
        call: repository-management-folders.listfoldercontents
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: repository-management-folders-mcp
    port: 9090
    transport: http
    description: MCP adapter for Automation Anywhere Repository Management API — Folders. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: create-folder
      description: Create a folder
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: repository-management-folders.createfolder
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: update-folder
      description: Update a folder
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: repository-management-folders.updatefolder
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-folder
      description: Delete a folder
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: repository-management-folders.deletefolder
      outputParameters:
      - type: object
        mapping: $.
    - name: list-folder-contents
      description: List folder contents
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: repository-management-folders.listfoldercontents
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.

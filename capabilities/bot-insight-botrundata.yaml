    port: 9090
    transport: http
    description: MCP adapter for Automation Anywhere Bot Insight API — BotRunData. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: get-bot-run-data
      description: Get bot run data
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bot-insight-botrundata.getbotrundata
      outputParameters:
      - type: object
        mapping: $.

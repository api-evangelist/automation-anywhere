      name: getbotrundata-startindex-startdate
      description: REST surface for getbotrundata-startIndex-startDate.
      operations:
      - method: GET
        name: getbotrundata
        description: Get bot run data
        call: bot-insight-botrundata.getbotrundata
        outputParameters:
        - type: object
          mapping: $.

  tags:
  - Automation Anywhere
  - BotRunData
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AUTOMATION_ANYWHERE_API_KEY: AUTOMATION_ANYWHERE_API_KEY
capability:
  consumes:
  - type: http
    namespace: bot-insight-botrundata
    baseUri: https://{controlRoomUrl}/v2/botinsight/data/api
    description: Automation Anywhere Bot Insight API — BotRunData business capability. Self-contained, no shared references.
    resources:
    - name: getbotrundata-startIndex-startDate
      path: /getbotrundata/{startIndex}/{startDate}
      operations:
      - name: getbotrundata
        method: GET
        description: Get bot run data
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.

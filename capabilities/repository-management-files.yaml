naftiko: 1.0.0-alpha2
info:
  label: Automation Anywhere Repository Management API — Files
  description: 'Automation Anywhere Repository Management API — Files. 9 operations. Lead operation: List files in the repository.
    Self-contained Naftiko capability covering one Automation Anywhere business surface.'
  tags:
  - Automation Anywhere
  - Files
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AUTOMATION_ANYWHERE_API_KEY: AUTOMATION_ANYWHERE_API_KEY
capability:

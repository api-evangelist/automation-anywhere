    namespace: repository-management-files
    baseUri: https://{controlRoomUrl}/v2/repository
    description: Automation Anywhere Repository Management API — Files business capability. Self-contained, no shared references.
    resources:
    - name: file-list
      path: /file/list
      operations:
      - name: listfiles
        method: POST
        description: List files in the repository
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: files-packagesVersionUpdate
      path: /files/packagesVersionUpdate
      operations:
      - name: updatepackageversions
        method: POST
        description: Update package versions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: files-version-assignLabel
      path: /files/version/assignLabel
      operations:
      - name: assignversionlabel
        method: POST
        description: Assign production label to bot version
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: files-fileid-content
      path: /files/{fileid}/content
      operations:
      - name: downloadfile
        method: GET
        description: Download file contents
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: files-fileid-dependencies
      path: /files/{fileid}/dependencies
      operations:
      - name: getfiledependencies
        method: GET
        description: View file dependencies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: files-fileid-dependencies-workspaceId
      path: /files/{fileid}/dependencies/{workspaceId}
      operations:
      - name: updatefiledependencies
        method: PUT
        description: Update manual file dependencies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: files-fileid-parents
      path: /files/{fileid}/parents
      operations:
      - name: getfileparents
        method: GET
        description: Get file parent folders
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: files-id
      path: /files/{id}
      operations:
      - name: deletefile
        method: DELETE
        description: Delete a file
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: recover
      path: /recover
      operations:
      - name: recoverbots
        method: POST
        description: Recover bots from deleted user repository
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true

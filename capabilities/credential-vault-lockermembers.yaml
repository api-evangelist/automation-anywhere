    resources:
    - name: lockers-id-members
      path: /lockers/{id}/members
      operations:
      - name: listlockermembers
        method: GET
        description: Get locker members
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: lockers-id-members-userId
      path: /lockers/{id}/members/{userId}
      operations:
      - name: updatelockermember
        method: PUT
        description: Update locker member permissions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).

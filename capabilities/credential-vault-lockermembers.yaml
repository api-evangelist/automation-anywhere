        name: listlockermembers
        description: Get locker members
        call: credential-vault-lockermembers.listlockermembers
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/lockers/{id}/members/{userid}
      name: lockers-id-members-userid
      description: REST surface for lockers-id-members-userId.
      operations:
      - method: PUT
        name: updatelockermember
        description: Update locker member permissions
        call: credential-vault-lockermembers.updatelockermember
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.

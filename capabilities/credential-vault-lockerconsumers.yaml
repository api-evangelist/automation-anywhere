naftiko: 1.0.0-alpha2
info:
  label: Automation Anywhere Credential Vault API — LockerConsumers
  description: 'Automation Anywhere Credential Vault API — LockerConsumers. 3 operations. Lead operation: List locker consumers.
    Self-contained Naftiko capability covering one Automation Anywhere business surface.'
  tags:
  - Automation Anywhere
  - LockerConsumers
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AUTOMATION_ANYWHERE_API_KEY: AUTOMATION_ANYWHERE_API_KEY
capability:
  consumes:
  - type: http
    namespace: credential-vault-lockerconsumers
    baseUri: https://{controlRoomUrl}/v2/credentialvault
    description: Automation Anywhere Credential Vault API — LockerConsumers business capability. Self-contained, no shared
      references.
    resources:
    - name: lockers-id-consumers
      path: /lockers/{id}/consumers
      operations:
      - name: listlockerconsumers
        method: GET
        description: List locker consumers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: addlockerconsumer
        method: POST
        description: Add a locker consumer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: lockers-id-consumers-roleId
      path: /lockers/{id}/consumers/{roleId}
      operations:
      - name: removelockerconsumer
        method: DELETE
        description: Remove a locker consumer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: roleId
          in: path
          type: integer
          description: Numeric ID of the consumer role to remove
          required: true
    authentication:
      type: bearer
      token: '{{env.AUTOMATION_ANYWHERE_API_KEY}}'
  exposes:
  - type: rest
    namespace: credential-vault-lockerconsumers-rest
    port: 8080
    description: REST adapter for Automation Anywhere Credential Vault API — LockerConsumers. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/lockers/{id}/consumers
      name: lockers-id-consumers
      description: REST surface for lockers-id-consumers.
      operations:
      - method: GET
        name: listlockerconsumers
        description: List locker consumers
        call: credential-vault-lockerconsumers.listlockerconsumers
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: addlockerconsumer
        description: Add a locker consumer
        call: credential-vault-lockerconsumers.addlockerconsumer
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/lockers/{id}/consumers/{roleid}
      name: lockers-id-consumers-roleid
      description: REST surface for lockers-id-consumers-roleId.
      operations:
      - method: DELETE
        name: removelockerconsumer
        description: Remove a locker consumer
        call: credential-vault-lockerconsumers.removelockerconsumer
        with:
          roleId: rest.roleId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: credential-vault-lockerconsumers-mcp
    port: 9090
    transport: http
    description: MCP adapter for Automation Anywhere Credential Vault API — LockerConsumers. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: list-locker-consumers
      description: List locker consumers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: credential-vault-lockerconsumers.listlockerconsumers
      outputParameters:
      - type: object
        mapping: $.
    - name: add-locker-consumer
      description: Add a locker consumer
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: credential-vault-lockerconsumers.addlockerconsumer
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: remove-locker-consumer
      description: Remove a locker consumer
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: credential-vault-lockerconsumers.removelockerconsumer
      with:
        roleId: tools.roleId
      outputParameters:
      - type: object
        mapping: $.

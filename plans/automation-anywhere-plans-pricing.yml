notes: Automation Anywhere does not publish per-edition prices on its public site. Pricing is quote-based
  and varies by edition (Cloud Starter, Pro, Enterprise / Automation 360), bot count, and AI-Agent
  Studio add-ons. There is a free Community Edition for individuals and a 30-day Cloud trial.
tags:
  - RPA
  - Intelligent Automation
  - AI Agents
  - Workflow Automation
  - Document Automation
  - Enterprise
description: Automation Anywhere sells the Automation 360 platform via three commercial editions
  (Cloud Starter, Pro, Enterprise) plus a free Community Edition. Public pricing is not posted; sales
  contact is required for tier and bot-count quotes. Add-on products (AI Agent Studio, Document
  Automation, Co-Pilot) are licensed separately.
sources:
